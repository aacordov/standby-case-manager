# ==========================================
# Docker Compose - PRODUCCIÓN
# ==========================================
# Imágenes optimizadas sin volúmenes de código
# Multi-worker backend para mejor performance
# Nginx sirviendo frontend estático
# Restart policies configuradas
# Resource limits aplicados
# ==========================================

services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: standby_db_prod
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=en_US.UTF-8
    ports:
      - "5432:5432"
    networks:
      - standby-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # Redis Cache
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: standby_redis_prod
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    networks:
      - standby-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # Backend FastAPI
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        - BUILD_DATE=${BUILD_DATE:-unknown}
        - VERSION=${VERSION:-2.3.0}
    image: standby-backend:${VERSION:-latest}
    container_name: standby_backend_prod
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      # JWT (CRITICAL: cambiar en producción)
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      # CORS (solo dominios permitidos)
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://ggdc-scm.conecel.com}
      # Environment
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - standby-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
  
  # ==========================================
  # Frontend React (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod  # Build estático con Nginx
      args:
        - VITE_APP_BUILD_DATE=${BUILD_DATE}
        - VITE_APP_VERSION=${VERSION}
        - VITE_API_URL=http://backend:8000
    image: standby-frontend:${VERSION:-latest}
    container_name: standby_frontend_prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - NGINX_HOST=${DOMAIN:-localhost}
      - NGINX_PORT=80
    depends_on:
      - backend
    networks:
      - standby-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

# ==========================================
# Networks
# ==========================================
networks:
  standby-network:
    driver: bridge
    name: standby-network-prod

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
    name: standby_postgres_data_prod
    driver: local
  redis_data:
    name: standby_redis_data_prod
    driver: local
  standby_uploads:
    name: standby_uploads_prod
    driver: local